
name: KHCA Website Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Check KHCA website
        run: |
          curl -L -sS -o /dev/null \
            -w "HTTP: %{http_code} | Time: %{time_total}s\n" \
            --max-time 60 \
            https://exampaper.khca.info/
